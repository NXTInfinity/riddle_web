<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Cluehouse</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=DM+Sans:wght@400;500;700&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout concept: a detective's desk. Quiet slate ground, one case-file paper surface, and two player colours (teal and raspberry) that mean "player 1" and "player 2" everywhere. */
:root{
  --bg:#EDF0F5; --surface:#FFFFFF; --surface-2:#E4E9F1; --fg:#17202E; --muted:#58657A; --line:#CBD3DF;
  --p1:#0E7C86; --p2:#B83A63; --gold:#8F6210; --good:#1B7F47; --bad:#B42318; --on-accent:#FFFFFF; --ad:#DEE3EC;
  --font-d:'Bricolage Grotesque','Trebuchet MS',system-ui,sans-serif;
  --font-b:'DM Sans',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-m:'JetBrains Mono',ui-monospace,Menlo,Consolas,monospace;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#0F141C; --surface:#171E29; --surface-2:#1F2836; --fg:#E6EBF3; --muted:#98A5BA; --line:#2C3748;
    --p1:#3CC4CF; --p2:#F07AA0; --gold:#E5B454; --good:#4CC380; --bad:#F1766B; --on-accent:#08141A; --ad:#1B2433;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0F141C; --surface:#171E29; --surface-2:#1F2836; --fg:#E6EBF3; --muted:#98A5BA; --line:#2C3748;
  --p1:#3CC4CF; --p2:#F07AA0; --gold:#E5B454; --good:#4CC380; --bad:#F1766B; --on-accent:#08141A; --ad:#1B2433;
  color-scheme:dark;
}
*{box-sizing:border-box}
body{
  margin:0; background:var(--bg); color:var(--fg); font:400 16px/1.55 var(--font-b);
  padding-left:max(16px,env(safe-area-inset-left,0px)); padding-right:max(16px,env(safe-area-inset-right,0px));
}
.shell{max-width:980px; margin:0 auto; padding-block:20px 56px; display:flex; flex-direction:column; gap:20px}
a{color:inherit}
:focus-visible{outline:2px solid var(--p1); outline-offset:2px}
.sr{position:absolute; width:1px; height:1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap}

/* header */
.top{display:flex; flex-wrap:wrap; gap:10px 24px; align-items:center; justify-content:space-between}
.brand{display:flex; align-items:center; gap:10px; font:700 1.55rem var(--font-d); letter-spacing:-.02em; text-decoration:none}
.brand svg{width:26px; height:26px; color:var(--p1)}
#nav{display:flex; flex-wrap:wrap; gap:4px}
#nav a{padding:8px 13px; border-radius:999px; color:var(--muted); text-decoration:none; font-weight:500; font-size:.95rem}
#nav a:hover{color:var(--fg)}
#nav a[aria-current="page"]{background:var(--fg); color:var(--bg)}

/* scoreboard */
.bar{display:flex; flex-wrap:wrap; gap:10px}
.score{display:flex; align-items:baseline; gap:10px; padding:7px 14px; border-radius:999px; background:var(--surface); border:1.5px solid var(--line); font-size:.92rem}
.score b{font-weight:700}
.score span{font-variant-numeric:tabular-nums; color:var(--muted)}
.score i{width:10px; height:10px; border-radius:50%; align-self:center; background:var(--muted)}
.score.p1 i{background:var(--p1)} .score.p2 i{background:var(--p2)}
.score.on.p1{border-color:var(--p1)} .score.on.p2{border-color:var(--p2)} .score.on.team{border-color:var(--fg)}
.stat{margin-left:auto; color:var(--muted); font-size:.9rem; align-self:center}

/* type */
h1,h2,h3{font-family:var(--font-d); letter-spacing:-.02em; text-wrap:balance; margin:0}
.hero h1{font-size:clamp(2.1rem,6.4vw,3.6rem); line-height:1.04; font-weight:700; letter-spacing:-.035em; margin-bottom:14px}
.hero p, .lede{max-width:58ch; color:var(--muted); margin:0; font-size:1.05rem}
.hero .eyebrow{margin-bottom:10px}
h2{font-size:1.6rem; line-height:1.15}
h3{font-size:1.05rem}
.eyebrow{font:500 .75rem var(--font-m); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.muted{color:var(--muted)}

/* surfaces */
.card{background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:20px; min-width:0}
.stack{display:flex; flex-direction:column; gap:16px}
.row{display:flex; flex-wrap:wrap; gap:10px; align-items:center}
.tiles{display:grid; grid-template-columns:repeat(auto-fit,minmax(215px,1fr)); gap:14px}
.tile{display:flex; flex-direction:column; gap:6px; text-align:left; text-decoration:none; background:var(--surface); border:1px solid var(--line); border-radius:14px; padding:18px; cursor:pointer; color:inherit; font:inherit; min-width:0}
.tile:hover{border-color:var(--fg)}
.tile h3{font-size:1.25rem}
.tile p{margin:0; color:var(--muted); font-size:.93rem}
.tile .eyebrow{color:var(--p1)}

/* controls */
.btn{font:600 .95rem var(--font-b); padding:10px 18px; min-height:44px; border-radius:10px; border:1.5px solid var(--line); background:var(--surface); color:var(--fg); cursor:pointer; text-decoration:none; display:inline-flex; align-items:center; justify-content:center; gap:8px}
.btn:hover{border-color:var(--fg)}
.btn.primary{background:var(--p1); border-color:var(--p1); color:var(--on-accent)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.ghost{background:transparent}
.btn.small{min-height:36px; padding:6px 12px; font-size:.88rem}
.btn:disabled{opacity:.45; cursor:default}
input[type=text],input[type=number]{font:inherit; min-height:44px; min-width:0; padding:10px 14px; border:1.5px solid var(--line); border-radius:10px; background:var(--bg); color:var(--fg)}
input:focus{border-color:var(--p1); outline:none}
.pills{display:flex; flex-wrap:wrap; gap:8px}
.pill{font:500 .9rem var(--font-b); padding:7px 14px; border-radius:999px; border:1.5px solid var(--line); background:transparent; color:var(--fg); cursor:pointer; min-height:38px}
.pill[aria-pressed="true"]{background:var(--fg); color:var(--bg); border-color:var(--fg)}
.field{display:flex; flex-direction:column; gap:6px; min-width:0; flex:1 1 180px}
.field label{font-size:.82rem; color:var(--muted); font-weight:500}
.modes{display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:10px}
.mode{display:flex; flex-direction:column; gap:2px; text-align:left; padding:12px 14px; border-radius:12px; border:1.5px solid var(--line); background:var(--bg); color:var(--fg); cursor:pointer; font:inherit}
.mode b{font-weight:700}
.mode span{font-size:.86rem; color:var(--muted)}
.mode[aria-pressed="true"]{border-color:var(--p1); background:var(--surface)}

/* puzzle */
.puzzle{display:flex; flex-direction:column; gap:16px}
.meta{display:flex; flex-wrap:wrap; gap:8px 14px; align-items:center}
.tag{font:500 .72rem var(--font-m); letter-spacing:.08em; text-transform:uppercase; padding:4px 9px; border-radius:6px; background:var(--surface-2)}
.diff{font:500 .8rem var(--font-m); color:var(--gold); letter-spacing:.1em}
.who{margin-left:auto; font-weight:700; font-size:.9rem}
.who.p1{color:var(--p1)} .who.p2{color:var(--p2)}
.q{font:600 clamp(1.2rem,3.4vw,1.55rem)/1.3 var(--font-d); letter-spacing:-.01em; margin:0; text-wrap:pretty}
.code{font:500 1.15rem/1.5 var(--font-m); letter-spacing:.06em; background:var(--surface-2); padding:12px 14px; border-radius:10px; white-space:pre-wrap; overflow-wrap:anywhere}
.ans{display:flex; flex-wrap:wrap; gap:10px}
.ans input{flex:1 1 220px}
.msg{min-height:1.4em; font-weight:600}
.msg.good{color:var(--good)} .msg.bad{color:var(--bad)} .msg.info{color:var(--muted)}
.hintlist{margin:0; padding-left:1.2em; color:var(--muted)}
.hintlist li+li{margin-top:4px}
.after{display:flex; flex-direction:column; gap:12px; padding-top:4px; border-top:1px dashed var(--line)}
.reveal{background:var(--surface-2); border-radius:10px; padding:12px 14px}
.reveal .eyebrow{display:block; margin-bottom:4px}

/* case files */
.casehead{display:flex; flex-wrap:wrap; gap:10px 16px; align-items:center; justify-content:space-between}
.dots{display:flex; gap:6px}
.dots i{width:12px; height:12px; border-radius:50%; border:2px solid var(--line)}
.dots i.done{background:var(--p1); border-color:var(--p1)} .dots i.now{border-color:var(--fg)}
.casegrid{display:grid; grid-template-columns:minmax(0,1fr) 270px; gap:16px; align-items:start}
.scene{font:400 .93rem/1.65 var(--font-m); background:var(--surface-2); border:1px dashed var(--line); border-radius:12px; padding:16px 18px; white-space:pre-wrap}
.notebook{position:sticky; top:12px}
.notebook ol{margin:10px 0 0; padding-left:1.2em; font-size:.92rem}
.notebook li+li{margin-top:10px}
.cases{display:grid; grid-template-columns:repeat(auto-fit,minmax(270px,1fr)); gap:14px}

/* ads */
.ad{display:flex; flex-direction:column; gap:4px}
.ad small{font:500 .68rem var(--font-m); letter-spacing:.1em; text-transform:uppercase; color:var(--muted)}
.ad-box{min-height:90px; display:grid; place-items:center; text-align:center; padding:8px; border:1px dashed var(--line); border-radius:10px; background:var(--ad); color:var(--muted); font-size:.82rem}
.ad.rect .ad-box{min-height:250px}
.foot{color:var(--muted); font-size:.85rem; max-width:70ch}

.bignum{font:700 3rem/1 var(--font-d); letter-spacing:-.03em; font-variant-numeric:tabular-nums}
.grid2{display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:14px}

@media (max-width:760px){
  .casegrid{grid-template-columns:minmax(0,1fr)}
  .notebook{position:static}
  .stat{margin-left:0; width:100%}
}
@media (prefers-reduced-motion:reduce){*{transition:none!important; animation:none!important}}
[hidden]{display:none!important}
:root{color-scheme:light}
</style>

</head>

/* ---------- pure logic: answer checking and puzzle generators ---------- */
function mulberry(seed){
  let a = seed >>> 0;
  return function(){
    a = (a + 0x6D2B79F5) | 0;
    let t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}
const randInt = (r, a, b) => a + Math.floor(r() * (b - a + 1));
const pick = (r, list) => list[Math.floor(r() * list.length)];

function norm(s){
  return String(s).toLowerCase()
    .replace(/&/g, " and ")
    .replace(/[’']/g, "")
    .replace(/(\d),(\d)/g, "$1$2")
    .replace(/[^a-z0-9. ]+/g, " ")
    .replace(/(?<!\d)\.|\.(?!\d)/g, " ")
    .replace(/\s+/g, " ").trim();
}
const stripArticle = s => s.replace(/^(a|an|the|your|my|its) /, "");
function lev(a, b){
  if (Math.abs(a.length - b.length) > 1) return 2;
  const d = [];
  for (let i = 0; i <= a.length; i++) d[i] = [i];
  for (let j = 1; j <= b.length; j++) d[0][j] = j;
  for (let i = 1; i <= a.length; i++)
    for (let j = 1; j <= b.length; j++)
      d[i][j] = Math.min(d[i-1][j] + 1, d[i][j-1] + 1, d[i-1][j-1] + (a[i-1] === b[j-1] ? 0 : 1));
  return d[a.length][b.length];
}
function oneSwap(a, b){
  if (a.length !== b.length) return false;
  for (let i = 0; i < a.length - 1; i++){
    if (a[i] !== b[i]) return a[i] === b[i+1] && a[i+1] === b[i] && a.slice(i + 2) === b.slice(i + 2);
  }
  return false;
}
function checkAnswer(input, answers){
  const n = norm(input);
  if (!n) return false;
  const s = stripArticle(n);
  for (const raw of answers){
    const a = norm(raw), as = stripArticle(a);
    if (n === a || s === as) return true;
    if (as.length >= 5 && (" " + n + " ").includes(" " + as + " ")) return true;
    if (as.length >= 6 && /^[a-z ]+$/.test(as) && (lev(s, as) <= 1 || oneSwap(s, as))) return true;
    if (as.length >= 4 && /^[a-z]+$/.test(as) && (s.replace(/s$/, "") === as.replace(/s$/, ""))) return true;
  }
  return false;
}
function answerPattern(a){
  a = String(a);
  if (/^[0-9.]+$/.test(a)) return "The answer is a number with " + a.length + " digit" + (a.length > 1 ? "s" : "") + ".";
  if (/^[A-Za-z ]+$/.test(a)){
    const w = a.trim().split(/\s+/);
    if (w.length === 1 && w[0].length <= 1) return "The answer is a single letter.";
    return "It starts with " + a[0].toUpperCase() + " and has " + w.map(x => x.length).join(" + ") + " letters.";
  }
  return "";
}

const WORDS = ["lantern","harbor","puzzle","whisper","compass","mystery","shadow","secret","garden","candle","mirror","thunder","anchor","forest","castle","window","market","rocket","island","silver","velvet","violin","winter","summer","bridge","dragon","pirate","meadow","copper","planet","ticket","jungle","marble","pepper","ribbon","saddle","temple","tunnel","wizard","yellow","zipper","basket","butter","cactus","donkey","feather","guitar","hammer","jacket","kitten","ladder","magnet","napkin","oyster","parrot","quiver","rabbit","sailor","turtle","umpire","valley","walnut","yogurt","blanket","cinema","desert","engine","falcon","goblin","hunter","jigsaw","kettle","locket","mitten","nectar","orchid","pillow","quartz","ripple","spider","thistle","uniform","voyage","whistle","pocket","rubber","saucer","trophy","violet","window"];
const WORD_POOL = Array.from(new Set(WORDS));
const FRUIT = ["apple","pear","plum","lemon","melon","banana","mango","kiwi","date","fig","lime","orange"];

function caesar(s, k){
  return s.replace(/[a-z]/gi, c => {
    const b = c <= "Z" ? 65 : 97;
    return String.fromCharCode((((c.charCodeAt(0) - b + k) % 26) + 26) % 26 + b);
  });
}
function plural(n, w){ return n === 1 ? w : w + "s"; }

function genSeq(n){
  const r = mulberry(n * 7919 + 11), k = randInt(r, 0, 5), L = 6;
  let arr = [], rule, d;
  if (k === 0){
    const a = randInt(r, 1, 120), s = randInt(r, 2, 45);
    for (let i = 0; i < L; i++) arr.push(a + s * i);
    rule = "Add " + s + " each time."; d = 1;
  } else if (k === 1){
    const a = randInt(r, 1, 9), m = randInt(r, 2, 4), c = randInt(r, 0, 6);
    let v = a; for (let i = 0; i < L; i++){ arr.push(v); v = v * m + c; }
    rule = c ? "Multiply by " + m + ", then add " + c + "." : "Multiply by " + m + " each time."; d = 2;
  } else if (k === 2){
    const a = randInt(r, 1, 14), add = randInt(r, 0, 9);
    for (let i = 0; i < L; i++) arr.push((a + i) * (a + i) + add);
    rule = "These are square numbers (" + a + "², " + (a+1) + "², " + (a+2) + "² ...)" + (add ? " plus " + add : "") + "."; d = 2;
  } else if (k === 3){
    const p = randInt(r, 1, 19), q = randInt(r, 1, 19), a = randInt(r, 1, 60);
    let v = a; for (let i = 0; i < L; i++){ arr.push(v); v += (i % 2 === 0 ? p : q); }
    rule = "Add " + p + ", then add " + q + ", and repeat."; d = 2;
  } else if (k === 4){
    let x = randInt(r, 1, 9), y = randInt(r, 2, 12);
    arr = [x, y]; while (arr.length < L) arr.push(arr[arr.length-1] + arr[arr.length-2]);
    rule = "Each number is the sum of the two before it."; d = 3;
  } else {
    const a = randInt(r, 1, 30), s = randInt(r, 1, 6);
    let v = a; for (let i = 0; i < L; i++){ arr.push(v); v += s + i; }
    rule = "The gaps grow: +" + s + ", +" + (s+1) + ", +" + (s+2) + ", and so on."; d = 3;
  }
  const ans = arr.pop();
  return {label:"Number chain #" + n, d, q:"What number comes next?", code:arr.join(",  ") + ",  ?",
    a:[String(ans)], h:["Look at the gaps between neighbouring numbers.","Check whether each number comes from adding, multiplying, or combining the ones before it."],
    x:rule + " The next number is " + ans + "."};
}

function genCipher(n){
  const r = mulberry(n * 104729 + 3);
  const w1 = pick(r, WORD_POOL); let w2 = pick(r, WORD_POOL); while (w2 === w1) w2 = pick(r, WORD_POOL);
  const s = randInt(r, 1, 12), hard = n % 3 === 0, phrase = w1 + " " + w2;
  const enc = caesar(phrase, s).toUpperCase();
  return {label:"Code breaker #" + n, d: hard ? 3 : (s <= 4 ? 1 : 2),
    q: hard ? "Every letter has been moved forward by the same number of places. What are the two words?"
            : "Every letter has been moved forward " + s + " place" + (s > 1 ? "s" : "") + " in the alphabet. What are the two words?",
    code: enc, a:[phrase, w1 + w2],
    h: hard ? ["The shift is somewhere between 1 and 12.","Try the shortest word first, and test each shift."]
            : ["Move each letter back " + s + " place" + (s > 1 ? "s" : "") + ", so " + enc[0] + " becomes " + caesar(enc[0].toLowerCase(), -s).toUpperCase() + ".","The first word has " + w1.length + " letters."],
    x: enc + " shifted back by " + s + " is " + phrase.toUpperCase() + "."};
}

function genJumble(n){
  const r = mulberry(n * 15485863 + 5);
  const w1 = pick(r, WORD_POOL); let w2 = pick(r, WORD_POOL); while (w2 === w1) w2 = pick(r, WORD_POOL);
  const shuffle = w => {
    let out = w;
    for (let t = 0; t < 12 && out === w; t++){
      const a = w.split("");
      for (let i = a.length - 1; i > 0; i--){ const j = Math.floor(r() * (i + 1)); const tmp = a[i]; a[i] = a[j]; a[j] = tmp; }
      out = a.join("");
    }
    return out;
  };
  const sort = w => w.split("").sort().join("");
  const anag = w => WORD_POOL.filter(x => sort(x) === sort(w));
  const combos = [];
  anag(w1).forEach(a => anag(w2).forEach(b => { combos.push(a + " " + b); combos.push(a + b); }));
  return {label:"Word jumble #" + n, d:2, q:"Two words, each with its letters shuffled. Put them back in order.",
    code: shuffle(w1).toUpperCase().split("").join(" ") + "      " + shuffle(w2).toUpperCase().split("").join(" "),
    a: combos, h:["The first word has " + w1.length + " letters and the second has " + w2.length + ".","The first word starts with " + w1[0].toUpperCase() + " and the second with " + w2[0].toUpperCase() + "."],
    x:"The words are " + w1.toUpperCase() + " and " + w2.toUpperCase() + "."};
}

function genMath(n){
  const r = mulberry(n * 32452843 + 9), t = randInt(r, 0, 2);
  if (t === 0){
    const x = randInt(r, 2, 40), m = randInt(r, 2, 12), k = randInt(r, 1, 60), R = x * m + k;
    return {label:"Brain math #" + n, d:1, q:"I am thinking of a number. I multiply it by " + m + " and add " + k + ". I get " + R + ". What is my number?",
      a:[String(x)], h:["Undo the last step first.","Take " + k + " away from " + R + ", then divide."], x:"(" + R + " - " + k + ") / " + m + " = " + x + "."};
  }
  if (t === 1){
    const x = randInt(r, 2, 90), A = randInt(r, 1, 40), R = (x + A) * 2;
    return {label:"Brain math #" + n, d:2, q:"I add " + A + " to my number, then double it. The result is " + R + ". What is my number?",
      a:[String(x)], h:["Work backwards: undo the doubling first.","Half of " + R + " is " + (R / 2) + "."], x:R + " / 2 - " + A + " = " + x + "."};
  }
  const A = 2 * randInt(r, 1, 25), x = randInt(r, A / 2 + 1, A / 2 + 60), R = x - A / 2;
  return {label:"Brain math #" + n, d:3, q:"I double my number, take away " + A + ", then halve the result. I get " + R + ". What is my number?",
    a:[String(x)], h:["Work backwards: undo the halving first.","Double " + R + " is " + (2 * R) + "."], x:"(2 x " + x + " - " + A + ") / 2 = " + R + "."};
}

function genMarket(n){
  const r = mulberry(n * 49979687 + 13), v = randInt(r, 0, 2);
  const a = pick(r, FRUIT); let b = pick(r, FRUIT); while (b === a) b = pick(r, FRUIT);
  const p = randInt(r, 2, 15);
  if (v === 0){
    const m = randInt(r, 2, 6), c = randInt(r, 2, 9), ans = c * m * p;
    return {label:"Market puzzle #" + n, d:2, q:"A " + a + " costs $" + p + ". A " + b + " costs " + m + " times as much as a " + a + ". How much do " + c + " " + b + "s cost, in dollars?",
      a:[String(ans)], h:["First find the price of one " + b + ".","One " + b + " costs " + m + " x " + p + "."], x:"One " + b + " is $" + (m * p) + ", so " + c + " cost $" + ans + "."};
  }
  if (v === 1){
    const c = randInt(r, 2, 8), e = randInt(r, 2, 8), q = randInt(r, 2, 12), T = c * p + e * q;
    return {label:"Market puzzle #" + n, d:3, q:c + " " + plural(c, a) + " and " + e + " " + plural(e, b) + " cost $" + T + " in total. Each " + a + " costs $" + p + ". How many dollars does one " + b + " cost?",
      a:[String(q)], h:["Find what the " + plural(c, a) + " cost on their own, then take that from the total.","The " + plural(c, a) + " cost " + c + " x " + p + " = " + (c * p) + "."], x:"$" + T + " - $" + (c * p) + " = $" + (e * q) + " for " + e + " " + plural(e, b) + ", so one costs $" + q + "."};
  }
  const c = randInt(r, 2, 9), tot = c * p, bill = Math.ceil((tot + 1) / 10) * 10;
  return {label:"Market puzzle #" + n, d:1, q:"I buy " + c + " " + plural(c, a) + " at $" + p + " each and pay with a $" + bill + " note. How many dollars of change do I get?",
    a:[String(bill - tot)], h:["First find the total cost.","The total is " + c + " x " + p + " = " + tot + "."], x:"$" + bill + " - $" + tot + " = $" + (bill - tot) + "."};
}

    nb.focus({preventScroll:false});
  }

  form.addEventListener("submit", e => {
    e.preventDefault();
    if (finished) return;
    const v = input.value;
    if (!v.trim()) return;
    if (checkAnswer(v, p.a)) finish(true);
    else {
      wrong++;
      msg.className = "msg bad";
      msg.textContent = ["Not quite. Try again.", "Not that one. Read the wording again.", "Still no. A hint costs 4 points."][Math.min(wrong - 1, 2)];
      input.select();
    }
  });
  hintBtn.addEventListener("click", () => {
    if (finished || hintsUsed >= hints.length) return;
    hl.hidden = false;
    const li = document.createElement("li"); li.textContent = hints[hintsUsed]; hl.appendChild(li);
    hintsUsed++; setHintBtn();
  });
  giveBtn.addEventListener("click", () => { if (!finished) finish(false); });
  if (window.matchMedia && matchMedia("(pointer:fine)").matches) input.focus({preventScroll:true});
}

const riddlePuzzle = (r, i) => ({id:"q" + i, label:r[0], d:r[1], q:r[2], a:r[3], h:r[4], x:r[5]});

/* ---------- views ---------- */
function viewHome(){
  const solvedQ = Object.keys(save.solved).filter(k => k[0] === "q").length;
  $("#view").innerHTML =
    '<div class="stack">' +
      '<section class="hero"><p class="eyebrow">Riddles and mysteries for one or two</p>' +
        "<h1>Solve it alone, or lean in together.</h1>" +
        "<p>Quick riddles for a spare minute, multi-step case files for a whole evening, and a vault of numbered puzzles you can race a friend on.</p></section>" +
      '<section class="card stack"><h2>Who is playing?</h2>' +
        '<div class="modes">' +
          '<button class="mode" type="button" data-mode="solo" aria-pressed="' + (S.mode === "solo") + '"><b>Solo</b><span>Just you. Your score, your pace.</span></button>' +
          '<button class="mode" type="button" data-mode="turns" aria-pressed="' + (S.mode === "turns") + '"><b>Take turns</b><span>Two players, one screen. Riddles alternate and scores stay separate.</span></button>' +
          '<button class="mode" type="button" data-mode="team" aria-pressed="' + (S.mode === "team") + '"><b>Team up</b><span>Solve together and build one shared score.</span></button>' +
        "</div>" +
        '<div class="row"><div class="field"><label for="name1">Player 1</label><input id="name1" type="text" maxlength="16" value="' + esc(S.names[0]) + '"></div>' +
        '<div class="field" id="f2"' + (S.mode === "solo" ? " hidden" : "") + '><label for="name2">Player 2</label><input id="name2" type="text" maxlength="16" value="' + esc(S.names[1]) + '"></div>' +
        '<button class="btn ghost" type="button" id="resetScores">Reset scores</button></div>' +
      "</section>" +
      '<div class="tiles">' +
        '<a class="tile" href="#quick" data-nav="quick"><span class="eyebrow">' + RIDDLES.length + " riddles</span><h3>Quick riddles</h3><p>Rounds of ten across classic, wordplay, logic, math and more. You have solved " + solvedQ + ".</p></a>" +
        '<a class="tile" href="#cases" data-nav="cases"><span class="eyebrow">' + CASES.length + " mysteries</span><h3>Case files</h3><p>Solve a puzzle, earn a clue, and use it in the next one until the case cracks.</p></a>" +
        '<a class="tile" href="#vault" data-nav="vault"><span class="eyebrow">5 types, 1 to 9,999</span><h3>Puzzle vault</h3><p>Numbered puzzles that are the same for everyone. Send a number, race a friend.</p></a>' +
        '<a class="tile" href="#daily" data-nav="daily"><span class="eyebrow">New every day</span><h3>Daily riddle</h3><p>One riddle a day. Solve it to grow your streak.</p></a>' +
      "</div>" +
      ad("banner", "home-bottom") +
    "</div>";
  $$(".mode").forEach(b => b.addEventListener("click", () => {
    S.mode = b.dataset.mode; save.mode = S.mode; S.turn = 0; persist();
    $$(".mode").forEach(x => x.setAttribute("aria-pressed", String(x === b)));
    $("#f2").hidden = S.mode === "solo"; renderBar();
  }));
  const setName = (i, el) => el.addEventListener("input", () => { S.names[i] = el.value.trim() || "Player " + (i + 1); save.names = S.names.slice(); persist(); renderBar(); });
  setName(0, $("#name1")); setName(1, $("#name2"));
  $("#resetScores").addEventListener("click", () => { S.scores = [0, 0]; S.team = 0; S.turn = 0; renderBar(); });
}

const qState = {cat:"All", diff:0};
function viewQuick(){
  const cats = ["All"].concat(Array.from(new Set(RIDDLES.map(r => r[0]))));
  const diffs = [[0, "Any"], [1, "Easy"], [2, "Medium"], [3, "Hard"]];
  const poolOf = () => RIDDLES.map(riddlePuzzle).filter(p => (qState.cat === "All" || p.label === qState.cat) && (!qState.diff || p.d === qState.diff));
  const solvedTotal = Object.keys(save.solved).filter(k => k[0] === "q").length;
  $("#view").innerHTML =
    '<div class="stack"><div><p class="eyebrow">Quick riddles</p><h2>Pick a flavour, play a round of ten.</h2></div>' +
    '<section class="card stack">' +
      '<div><span class="eyebrow">Category</span><div class="pills" id="cats" style="margin-top:8px">' + cats.map(c => '<button class="pill" type="button" data-cat="' + c + '" aria-pressed="' + (qState.cat === c) + '">' + c + "</button>").join("") + "</div></div>" +
      '<div><span class="eyebrow">Difficulty</span><div class="pills" id="diffs" style="margin-top:8px">' + diffs.map(d => '<button class="pill" type="button" data-diff="' + d[0] + '" aria-pressed="' + (qState.diff === d[0]) + '">' + d[1] + "</button>").join("") + "</div></div>" +
      '<div class="row"><button class="btn primary" type="button" id="startRound"></button><span class="muted" id="poolInfo"></span></div>' +
    "</section>" +
    '<p class="muted">You have solved ' + solvedTotal + " of " + RIDDLES.length + " riddles. Unsolved ones come first in every round.</p>" + ad("banner", "quick-bottom") + "</div>";
  const refresh = () => {
    const n = poolOf().length;
    $("#poolInfo").textContent = n + " riddle" + (n === 1 ? "" : "s") + " match";
    $("#startRound").textContent = "Start a round of " + Math.min(10, n);
    $("#startRound").disabled = n === 0;
    $$("#cats .pill").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.cat === qState.cat)));
    $$("#diffs .pill").forEach(b => b.setAttribute("aria-pressed", String(+b.dataset.diff === qState.diff)));
  };
  $$("#cats .pill").forEach(b => b.addEventListener("click", () => { qState.cat = b.dataset.cat; refresh(); }));
  $$("#diffs .pill").forEach(b => b.addEventListener("click", () => { qState.diff = +b.dataset.diff; refresh(); }));
  $("#startRound").addEventListener("click", () => {
    const pool = poolOf();
    const fresh = shuffleArr(pool.filter(p => !save.solved[p.id])), old = shuffleArr(pool.filter(p => save.solved[p.id]));
    playRound(fresh.concat(old).slice(0, 10));
  });
  refresh();
}
function playRound(list){
  let i = 0, got = 0, pts = 0;
  const step = () => {
    if (i >= list.length) return roundSummary(list.length, got, pts);
    $("#view").innerHTML = '<div class="stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">Riddle ' + (i + 1) + " of " + list.length + '</span><button class="btn small ghost" type="button" id="endRound">End round</button></div><div id="host"></div></div>';
    $("#endRound").addEventListener("click", () => roundSummary(i, got, pts));
    runPuzzle($("#host"), list[i], {id:list[i].id, nextLabel:i === list.length - 1 ? "See results" : "Next riddle", onDone:r => { if (r.solved) got++; pts += r.pts; i++; step(); }});
  };
  step();
}
function roundSummary(total, got, pts){
  $("#view").innerHTML =
    '<div class="stack"><section class="card stack"><p class="eyebrow">Round complete</p><div class="bignum">' + got + " / " + total + '</div>' +
    '<p class="lede">' + (got === total && total ? "A clean sweep." : got ? "Nice work. " + got + " solved without giving up." : "Tough round. The riddles will still be here.") + " You earned " + pts + " points.</p>" +
    '<div class="row"><button class="btn primary" type="button" id="again">Another round</button><a class="btn" href="#home" data-nav="home">Home</a></div></section>' + ad("rect", "round-summary") + "</div>";
  $("#again").addEventListener("click", viewQuick);
}

function viewCases(){
  $("#view").innerHTML = '<div class="stack"><div><p class="eyebrow">Case files</p><h2>Every answer is a clue for the next puzzle.</h2></div><div class="cases">' +
    CASES.map(c => {
      const done = save.cases[c.id] || 0, n = c.steps.length;
      const label = done >= n ? "Replay" : done ? "Continue" : "Open the file";
      return '<article class="card stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">' + c.level + " · " + n + ' steps</span><span class="diff">' + "●".repeat(c.diff) + "○".repeat(3 - c.diff) + "</span></div>" +
        "<h3 style=\"font-size:1.35rem\">" + esc(c.title) + '</h3><p class="muted" style="margin:0">' + esc(c.blurb) + "</p>" +
        '<div class="dots">' + c.steps.map((_, i) => '<i class="' + (i < done ? "done" : "") + '"></i>').join("") + "</div>" +
        '<button class="btn primary" type="button" data-case="' + c.id + '">' + label + "</button></article>";
    }).join("") + "</div>" + ad("banner", "cases-bottom") + "</div>";
  $$("[data-case]").forEach(b => b.addEventListener("click", () => {
    const c = CASES.find(x => x.id === b.dataset.case);
    if ((save.cases[c.id] || 0) >= c.steps.length){ save.cases[c.id] = 0; persist(); }
    caseIntro(c);
  }));
}
function caseIntro(c){
  const start = save.cases[c.id] || 0;
  if (start > 0) return playStep(c, start);
  $("#view").innerHTML = '<div class="stack"><a class="muted" href="#cases" data-nav="cases">← All case files</a><section class="card stack"><p class="eyebrow">' + c.level + " case</p><h2>" + esc(c.title) + '</h2><div class="scene">' + esc(c.intro) + '</div><div class="row"><button class="btn primary" type="button" id="go">Begin</button></div></section></div>';
  $("#go").addEventListener("click", () => playStep(c, 0));
}
function playStep(c, i){
  const n = c.steps.length;
  if (i >= n) return caseDone(c);
  const st = c.steps[i];
  const notes = c.steps.slice(0, i).map(s => "<li>" + esc(s.clue) + "</li>").join("");
  $("#view").innerHTML =
    '<div class="stack"><div class="casehead"><div><a class="muted" href="#cases" data-nav="cases">← All case files</a><h2>' + esc(c.title) + '</h2></div>' +
    '<div class="dots" aria-label="Step ' + (i + 1) + " of " + n + '">' + c.steps.map((_, k) => '<i class="' + (k < i ? "done" : k === i ? "now" : "") + '"></i>').join("") + "</div></div>" +
    '<div class="casegrid"><div class="stack"><div class="scene">' + esc(st.scene) + '</div><div id="host"></div></div>' +
    '<aside class="card notebook"><h3>Notebook</h3><p class="muted" style="margin:4px 0 0;font-size:.88rem">Clues you have found so far.</p>' +
    (notes ? "<ol>" + notes + "</ol>" : '<p class="muted" style="margin:10px 0 0;font-size:.9rem">Nothing yet. Solve the first puzzle.</p>') + "</aside></div></div>";
  runPuzzle($("#host"), {label:"Step " + (i + 1) + " of " + n, d:c.diff, q:st.q, code:st.code, a:st.a, h:st.h, x:st.x},
    {id:"c-" + c.id + "-" + i, reveal:st.clue, nextLabel:i === n - 1 ? "Close the case" : "Next step",
     onDone:() => { save.cases[c.id] = i + 1; persist(); playStep(c, i + 1); }});
}
function caseDone(c){
  award(15);
  $("#view").innerHTML = '<div class="stack"><section class="card stack"><p class="eyebrow">Case closed</p><h2>' + esc(c.title) + '</h2><div class="scene">' + esc(c.outro) + '</div><p class="muted" style="margin:0">Bonus for closing the case: +15 points.</p>' +
    '<div class="row"><a class="btn primary" href="#cases" data-nav="cases">More case files</a><a class="btn" href="#home" data-nav="home">Home</a></div></section>' + ad("rect", "case-closed") + "</div>";
}

const vState = {type:"seq", count:0};
function viewVault(){
  const types = Object.keys(VAULT);
  $("#view").innerHTML =
    '<div class="stack"><div><p class="eyebrow">Puzzle vault</p><h2>Pick a number. Everyone who picks it gets the same puzzle.</h2></div>' +
    '<section class="card stack"><div><span class="eyebrow">Type</span><div class="pills" id="vtypes" style="margin-top:8px">' + types.map(t => '<button class="pill" type="button" data-t="' + t + '" aria-pressed="' + (vState.type === t) + '">' + VAULT[t].name + "</button>").join("") + "</div>" +
    '<p class="muted" id="vblurb" style="margin:10px 0 0"></p></div>' +
    '<div class="row"><div class="field" style="flex:0 1 160px"><label for="vnum">Puzzle number (1 to ' + VAULT_MAX.toLocaleString("en-US") + ')</label><input id="vnum" type="number" min="1" max="' + VAULT_MAX + '" value="' + (1 + Math.floor(Math.random() * VAULT_MAX)) + '"></div>' +
    '<button class="btn primary" type="button" id="vplay" style="align-self:flex-end">Play this number</button><button class="btn" type="button" id="vrand" style="align-self:flex-end">Random puzzle</button></div>' +
    '<p class="muted" style="margin:0">Playing as a pair? Agree on a number, solve it separately, and compare who needed fewer hints.</p></section>' + ad("banner", "vault-bottom") + "</div>";
  const blurb = () => { $("#vblurb").textContent = VAULT[vState.type].blurb; $$("#vtypes .pill").forEach(b => b.setAttribute("aria-pressed", String(b.dataset.t === vState.type))); };
  blurb();
  $$("#vtypes .pill").forEach(b => b.addEventListener("click", () => { vState.type = b.dataset.t; blurb(); }));
  const go = n => { n = Math.min(VAULT_MAX, Math.max(1, Math.floor(+n) || 1)); playVault(vState.type, n); };
  $("#vplay").addEventListener("click", () => go($("#vnum").value));
  $("#vrand").addEventListener("click", () => go(1 + Math.floor(Math.random() * VAULT_MAX)));
}
function playVault(type, n){
  const p = VAULT[type].fn(n);
  p.id = "v-" + type + "-" + n;
  $("#view").innerHTML = '<div class="stack"><div class="row" style="justify-content:space-between"><span class="eyebrow">Puzzle vault · ' + esc(VAULT[type].name) + '</span><a class="btn small ghost" href="#vault" data-nav="vault">Back to the vault</a></div><div id="host"></div></div>';
  runPuzzle($("#host"), p, {id:p.id, nextLabel:"Next puzzle", onDone:() => {
    const next = n % VAULT_MAX + 1;
    if (++vState.count % 4 === 0){
      $("#view").innerHTML = '<div class="stack"><section class="card stack"><p class="eyebrow">Short break</p><h2>Four puzzles down.</h2><div class="row"><button class="btn primary" type="button" id="cont">Continue to #' + next + '</button><a class="btn" href="#vault" data-nav="vault">Back to the vault</a></div></section>' + ad("rect", "vault-break") + "</div>";
      $("#cont").addEventListener("click", () => playVault(type, next));
    } else playVault(type, next);
  }});
}

function viewDaily(){
  const today = dayKey(0), idx = Math.floor(mulberry(dayNum() * 2654435761 % 4294967296)() * RIDDLES.length);
  const p = riddlePuzzle(RIDDLES[idx], idx); p.id = "daily-" + today; p.label = "Daily riddle · " + today;
  const st = streakNow();
  if (save.lastDaily === today){
    $("#view").innerHTML = '<div class="stack"><section class="card stack"><p class="eyebrow">Daily riddle</p><div class="bignum">' + st + '</div><p class="lede">You solved today\'s riddle. That is a streak of ' + st + " day" + (st === 1 ? "" : "s") + ". A new riddle arrives tomorrow.</p>" +
      '<div class="row"><a class="btn primary" href="#quick" data-nav="quick">Play quick riddles</a><a class="btn" href="#vault" data-nav="vault">Open the vault</a></div></section>' + ad("banner", "daily-done") + "</div>";
    return;
  }
  $("#view").innerHTML = '<div class="stack"><div><p class="eyebrow">Daily riddle</p><h2>One riddle a day keeps the streak alive.</h2><p class="muted" style="margin:6px 0 0">Current streak: ' + st + ' day' + (st === 1 ? "" : "s") + '. Reveal the answer and the streak resets tomorrow.</p></div><div id="host"></div></div>';
  runPuzzle($("#host"), p, {id:p.id, nextLabel:"Done", onDone:r => {
    if (r.solved){ save.streak = (save.lastDaily === dayKey(-1)) ? save.streak + 1 : 1; save.lastDaily = today; persist(); }
    renderBar(); location.hash = "#home";
  }});
}

/* ---------- router ---------- */
const VIEWS = {home:viewHome, quick:viewQuick, cases:viewCases, vault:viewVault, daily:viewDaily};
function route(){
  const h = (location.hash || "#home").slice(1), name = VIEWS[h] ? h : "home";
  $$("#nav a").forEach(a => { if (a.dataset.nav === name) a.setAttribute("aria-current", "page"); else a.removeAttribute("aria-current"); });
  VIEWS[name]();
  renderBar();
  window.scrollTo(0, 0);
}
document.addEventListener("click", e => {
  const a = e.target.closest("a[data-nav]");
  if (a && location.hash === "#" + a.dataset.nav){ e.preventDefault(); route(); }
});
window.addEventListener("hashchange", route);
route();
})();
</script>
